name: 🚀 New Plugin Idea
description: Suggest creating a brand new Minecraft plugin
title: "[New Plugin]: "
type: Feature
labels: ["new-plugin"]
body:
  - type: textarea
    id: plugin-idea
    attributes:
      label: New Plugin Description
      description: Describe the main mechanics, commands, permissions, and target server type for this plugin.
      placeholder: Describe your vision for the new plugin here...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Screenshots / Concept Art / References (Optional)
      description: Drag and drop or paste (Ctrl+V) any concept images, GUI layouts, or reference screenshots.
      placeholder: Paste your images or references here...
    validations:
      required: false
