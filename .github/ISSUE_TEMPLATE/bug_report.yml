name: 🐛 Bug Report
description: Report a bug found in one of the plugins
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Select Plugin
      description: Which plugin does this issue affect?
      options:
        - Plugin 1 (change to your plugin name)
        - Plugin 2
        - Plugin 3
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      description: What client/server version are you running?
      placeholder: e.g., 1.21.4
    validations:
      required: true

  - type: input
    id: server-engine
    attributes:
      label: Server Software / Engine
      description: Enter the server software and its version (from /version).
      placeholder: e.g., Paper 1.21.4-130, Purpur, Spigot
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: What version of the plugin do you have installed?
      placeholder: e.g., v1.0.2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Describe clearly what is happening, and paste any relevant console logs or errors.
      placeholder: Describe the problem here...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce (Optional)
      description: How can we replicate this bug on a test server?
      placeholder: |
        1. Type command...
        2. Click on...
        3. Error appears in console
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have checked that a similar issue hasn't already been reported.
          required: true
