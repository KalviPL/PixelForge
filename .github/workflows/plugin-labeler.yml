name: Auto Label Plugin

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue form and assign plugin label
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            
            // Szuka sekcji "### Select Plugin" wygenerowanej przez formularz GitHuba
            const match = body.match(/### Select Plugin\s+([^\r\n]+)/);
            
            if (match && match[1]) {
              const pluginName = match[1].trim();
              
              // Pomija przypisanie, jeśli nie wybrano żadnej opcji
              if (pluginName && pluginName !== '_No response_') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: [pluginName]
                });
              }
            }
